<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#07090e"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#lfGrad)" stroke-width="8" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="url(#lfGrad)" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Outer Search Radar Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#lfGrad)" stroke-width="12" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Pin/Search Sparkle Symbol -->
  <path d="M256 120 C195 120 146 169 146 230 C146 312 256 400 256 400 C256 400 366 312 366 230 C366 169 317 120 256 120 Z" fill="url(#lfGrad)" opacity="0.9"/>
  <circle cx="256" cy="224" r="48" fill="#07090e"/>
  
  <!-- Center Star/Compass -->
  <polygon points="256,194 266,218 290,224 266,230 256,254 246,230 222,224 246,218" fill="url(#lfGrad)"/>
